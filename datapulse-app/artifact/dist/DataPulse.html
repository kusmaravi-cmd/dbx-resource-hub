<title>Everforth DataPulse</title>
<meta name="description" content="Everforth DataPulse: platform-agnostic data & AI readiness assessment with enforced levers.">
<style>
:root{
  /* Everforth brand (from the Everforth Apps Release Gate kit) */
  --teal:#113738; --teal-2:#1B4A4B; --deep:#0B2A2B; --slate:#466F78; --sage:#819E72;
  --mint:#F2F8F7; --mint-2:#E7F1EF; --pale:#CEEBE8; --lemon:#EEFF00; --purple:#4934A3;
  --bg:#FAFCFB; --panel:#F2F8F7; --panel2:#E7F1EF; --panel3:#DCE7E5;
  --border:#DCE7E5; --border2:#C9DAD7;
  --text:#343333; --muted:#56605F; --faint:#7A8886;
  --brand:var(--teal); --brand2:var(--sage); --accent:var(--slate);
  --s-enforced:#00909c; --s-claimed:#c27c0e; --s-backed:#6d5bd0;
  --good:#2f8f63; --warn:#9a6b00; --serious:#c2570c; --crit:#c0392b;
  --radius:10px; --shadow:0 8px 26px rgba(17,55,56,.12);
  --mono:Consolas,Menlo,ui-monospace,monospace;
  --sans:Arial,Helvetica,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
input[type=text],input[type=number],input[type=date],select,textarea{background:#fff;border:1px solid var(--border2);border-radius:8px;padding:7px 9px;width:100%}
textarea{min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{display:flex;min-height:100vh}
.sidebar{width:252px;flex:0 0 252px;background:var(--deep);border-right:1px solid rgba(206,235,232,.14);box-shadow:4px 0 24px rgba(0,0,0,.18);position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 12px;display:flex;flex-direction:column}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:7px;padding:4px 10px 18px;border-bottom:1px solid rgba(206,235,232,.14);margin-bottom:10px}
.brand .lockup{height:23px;width:auto;display:block}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:flex;align-items:center;justify-content:center;flex:0 0 36px}
.logo svg{width:21px;height:21px}
.brand-name{font-weight:700;font-size:15px;color:#fff;margin-top:4px}
.brand-sub{font-size:11.5px;color:var(--pale);letter-spacing:.3px}
.navsec{font-size:9.5px;text-transform:uppercase;letter-spacing:1.8px;color:var(--faint);margin:14px 10px 5px;font-weight:700}
.navbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:9px 12px;border:1px solid transparent;background:transparent;color:var(--pale);border-radius:10px;cursor:pointer;text-align:left;font-weight:700;font-size:12.5px;letter-spacing:.3px;margin-bottom:2px;transition:.15s}
.navbtn:hover{background:rgba(206,235,232,.06);color:var(--lemon)}
.navbtn.active{background:var(--lemon);color:var(--teal);border-color:var(--lemon)}
.navbtn[disabled]{opacity:.45;cursor:not-allowed}
.navbtn .cnt{font-size:10.5px;font-family:var(--mono);opacity:.75;font-weight:400}
.side-foot{margin-top:auto;font-size:11px;color:var(--pale);padding:10px;border:1px solid rgba(206,235,232,.16);border-radius:10px;background:rgba(255,255,255,.03);overflow-wrap:anywhere}
.side-foot b{color:#fff}
.main{flex:1;min-width:0}
.topbar{position:sticky;top:0;z-index:20;background:var(--teal);color:var(--pale);box-shadow:0 2px 14px rgba(0,0,0,.18);padding:11px 26px;display:flex;align-items:center;gap:14px}
.crumb{font-size:12.5px;color:var(--pale)} .crumb b{color:var(--lemon)}
.spacer{flex:1}
.badge{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid rgba(206,235,232,.35);color:#E9F3F1;background:transparent;white-space:nowrap}
.savestate{font-size:12px;color:var(--pale)} .savestate.err{color:#ffb3a8}
.iconbtn{border:1px solid rgba(206,235,232,.35);background:transparent;color:#fff;border-radius:8px;padding:4px 9px;cursor:pointer}
.menu{display:none}
.content{padding:26px;max-width:1200px;margin:0 auto}
.loading{color:var(--muted);padding:40px 0}
h1.title{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px;color:var(--teal);text-wrap:balance}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sage);margin-bottom:6px}
.lede{color:var(--muted);max-width:820px;margin-bottom:20px}
h2.sub{font-size:17px;font-weight:700;margin:26px 0 10px;color:var(--teal)}
h3{font-size:14.5px;font-weight:700;color:var(--teal)}
.card{background:var(--mint);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card.white{background:#fff}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.muted{color:var(--muted)} .small{font-size:12.5px} .tiny{font-size:11.5px} .mono{font-family:var(--mono)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px;font-weight:600}
.btn{border:1px solid var(--border2);background:#fff;border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn.primary:hover{background:var(--teal-2);color:var(--lemon)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:4px 9px;font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--border2);background:#fff;color:var(--muted);font-weight:650;white-space:nowrap}
.pill.crit{color:var(--crit);border-color:rgba(192,57,43,.35)} .pill.high{color:var(--serious);border-color:rgba(194,87,12,.35)}
.pill.traj{color:var(--s-backed);border-color:rgba(109,91,208,.35)}
.pill.t1{color:var(--brand)} .pill.t2{color:var(--accent)} .pill.t3{color:#5d7a4e}
.status{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:12px;padding:2px 9px;border-radius:20px}
.status.go{background:rgba(47,143,99,.12);color:var(--good)}
.status.cond{background:rgba(176,122,0,.13);color:var(--warn)}
.status.blocked{background:rgba(192,57,43,.11);color:var(--crit)}
.status.none{background:var(--panel2);color:var(--muted)}
.sev{font-size:10.5px;font-weight:750;text-transform:uppercase;letter-spacing:.05em;padding:1px 7px;border-radius:5px}
.sev.blocker{background:rgba(192,57,43,.12);color:var(--crit)} .sev.cap{background:rgba(194,87,12,.12);color:var(--serious)}
.sev.warning{background:rgba(176,122,0,.12);color:var(--warn)} .sev.info{background:var(--panel2);color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:none}
.tbl{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto}
.banner{margin:12px 26px 0;padding:10px 14px;border-radius:10px;background:rgba(192,57,43,.08);border:1px solid rgba(192,57,43,.3);color:var(--crit);font-size:13px;display:flex;gap:10px;align-items:center}
.banner.ok{background:rgba(47,143,99,.08);border-color:rgba(47,143,99,.3);color:var(--good)}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:#fff;border:1px solid var(--border);border-top:3px solid var(--teal);border-radius:10px;padding:14px 16px}
.tiles .tile:nth-child(2){border-top-color:var(--slate)} .tiles .tile:nth-child(3){border-top-color:var(--sage)} .tiles .tile:nth-child(4){border-top-color:var(--purple)}
.tile .k{font-size:11.5px;color:var(--muted);font-weight:600}
.tile .v{font-size:30px;font-weight:700;color:var(--teal);letter-spacing:-.03em;line-height:1.1;margin-top:4px}
.tile .v small{font-size:13px;color:var(--muted);font-weight:600;margin-left:3px}
.tile .d{font-size:12px;color:var(--muted);margin-top:4px}

/* interview */
.iv{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
.dimnav{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow-y:auto;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px}
.dimnav .tierh{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);font-weight:700;margin:10px 8px 4px}
.dimbtn{display:flex;align-items:center;gap:8px;width:100%;border:none;background:transparent;padding:6px 8px;border-radius:7px;cursor:pointer;text-align:left;font-size:13px}
.dimbtn:hover{background:var(--panel2)} .dimbtn.active{background:var(--teal);color:#fff;font-weight:700} .dimbtn.active .id,.dimbtn.active .prog{color:var(--pale)}
.dimbtn .id{font-family:var(--mono);font-size:11px;color:var(--muted);width:22px}
.dimbtn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dimbtn .prog{font-size:10.5px;font-family:var(--mono);color:var(--faint)}
.dimbtn .sc{font-size:11px;font-weight:700;font-family:var(--mono);min-width:26px;text-align:right}
.qcard{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.qcard.answered{border-left:3px solid var(--s-enforced)}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.qid{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.qprompt{font-size:15px;font-weight:600;line-height:1.45;margin-bottom:6px}
.qintent{font-size:12.5px;color:var(--muted);margin-bottom:8px}
details.more summary{cursor:pointer;font-size:12px;color:var(--accent);font-weight:600;margin:4px 0}
details.more ul{margin:4px 0 6px 18px;font-size:12.5px;color:var(--muted)}
.levels{display:grid;gap:5px;margin:10px 0}
.lvl{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:7px 10px;cursor:pointer;font-size:13px}
.lvl:hover{border-color:var(--accent)}
.lvl b{font-family:var(--mono);flex:0 0 auto;color:var(--muted)}
.lvl.on{background:var(--teal);color:#fff;border-color:var(--teal)} .lvl.on b{color:var(--lemon)}
.qfoot{display:grid;grid-template-columns:150px 1fr;gap:10px;margin-top:8px}
.evrow{display:grid;grid-template-columns:170px 1fr auto;gap:6px;margin-bottom:5px}
.enfnote{font-size:12px;margin-top:8px;padding:6px 9px;border-radius:7px;background:rgba(194,87,12,.08);color:var(--serious)}
.metric{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.metric input{width:140px}

/* dimension bars */
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.legend i{display:inline-block;vertical-align:middle;margin-right:5px}
.lg-enf{width:14px;height:8px;border-radius:2px;background:var(--s-enforced)}
.lg-cl{width:9px;height:9px;border-radius:50%;border:2px solid var(--s-claimed);background:#fff}
.lg-bk{width:3px;height:12px;background:var(--s-backed);border-radius:1px}
.bars{display:grid;gap:3px}
.bar{display:grid;grid-template-columns:200px 1fr 112px;gap:10px;align-items:center;padding:4px 6px;border-radius:7px}
.bar:hover{background:var(--panel2)}
.bar .lab{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .lab .mono{color:var(--muted);font-size:11px;margin-right:5px}
.track{position:relative;height:18px;background:linear-gradient(90deg,transparent calc(20% - 1px),var(--border) 20%,transparent calc(20% + 1px),transparent calc(40% - 1px),var(--border) 40%,transparent calc(40% + 1px),transparent calc(60% - 1px),var(--border) 60%,transparent calc(60% + 1px),transparent calc(80% - 1px),var(--border) 80%,transparent calc(80% + 1px))}
.track .fill{position:absolute;left:0;top:5px;height:8px;background:var(--s-enforced);border-radius:0 4px 4px 0}
.track .cl{position:absolute;top:4px;width:10px;height:10px;margin-left:-5px;border-radius:50%;border:2px solid var(--s-claimed);background:#fff}
.track .bk{position:absolute;top:2px;width:3px;height:14px;margin-left:-1.5px;background:var(--s-backed);border-radius:1px}
.track .tgt{position:absolute;top:-2px;bottom:-2px;width:0;border-left:2px dashed var(--faint)}
.bar .val{font-family:var(--mono);font-size:12px;text-align:right}
.axis{display:grid;grid-template-columns:200px 1fr 112px;gap:10px;padding:0 6px}
.axis .ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);font-family:var(--mono)}
.tip{position:fixed;z-index:60;pointer-events:none;background:#fff;border:1px solid var(--border2);box-shadow:var(--shadow);border-radius:9px;padding:8px 10px;font-size:12px;max-width:340px;display:none}

/* levers */
.waves{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.wave{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px}
.lcard{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 11px;margin-top:8px;cursor:pointer}
.lcard:hover{border-color:var(--accent)}
.lcard .nm{font-weight:650;font-size:13px;line-height:1.35}
.lcard .meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.lst{font-size:10.5px;font-weight:750;padding:1px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.04em}
.lst.Proposed{background:var(--panel2);color:var(--muted)} .lst.Committed{background:rgba(70,111,120,.14);color:var(--accent)}
.lst.Enforced{background:rgba(0,144,156,.14);color:#006d76} .lst.Verified{background:rgba(47,143,99,.14);color:var(--good)}
.lst.Retired{background:var(--panel2);color:var(--faint);text-decoration:line-through}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);background:#fff;box-shadow:-10px 0 30px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .2s;z-index:50;overflow-y:auto}
.drawer.open{transform:none}
.drawer-inner{padding:22px}
.scrim{position:fixed;inset:0;background:rgba(17,55,56,.18);display:none;z-index:40}
.scrim.open{display:block}
.steps{display:flex;gap:4px;margin:10px 0}
.steps span{flex:1;text-align:center;font-size:11px;padding:5px 0;border-radius:6px;background:var(--panel2);color:var(--faint);font-weight:650}
.steps span.done{background:rgba(0,144,156,.14);color:#006d76} .steps span.cur{background:var(--lemon);color:var(--teal)}
.errs{background:rgba(192,57,43,.07);border:1px solid rgba(192,57,43,.3);color:var(--crit);border-radius:9px;padding:10px 12px;font-size:13px;margin:10px 0}
.errs li{margin-left:16px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted);font-weight:600}
.impl{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:12.5px}
.impl .p{font-weight:650}
.impl .sel{background:rgba(0,144,156,.08);border-radius:5px;padding:0 4px}
.hist li{font-size:12px;color:var(--muted);margin-left:16px}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--border2);border-radius:12px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters select,.filters input{width:auto;min-width:160px}
.alist .item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);background:#fff}
.alist .item:first-child{border-radius:12px 12px 0 0} .alist .item:last-child{border-bottom:none;border-radius:0 0 12px 12px}
.alist{border:1px solid var(--border);border-radius:12px}
.prog-bar{height:6px;background:var(--panel3);border-radius:4px;overflow:hidden;width:140px}
.prog-bar i{display:block;height:100%;background:var(--s-enforced)}

@media (max-width:980px){
  .tiles,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .waves,.g3{grid-template-columns:1fr}
  .iv{grid-template-columns:1fr} .dimnav{position:static;max-height:none}
}
@media (max-width:760px){
  .sidebar{position:fixed;z-index:45;left:0;transform:translateX(-100%);transition:transform .2s}
  .sidebar.open{transform:none}
  .menu{display:inline-block}
  .content{padding:16px}
  .topbar{padding:10px 16px}
  .g2{grid-template-columns:1fr}
  .bar,.axis{grid-template-columns:110px 1fr 70px}
  .qfoot,.evrow{grid-template-columns:1fr}
  .banner{margin:10px 16px 0}
}

.content-wrap{min-height:calc(100vh - 52px);display:flex;flex-direction:column}
.foot{border-top:1px solid var(--border);background:#fff;margin-top:auto}
.foot .in{max-width:1200px;margin:0 auto;padding:18px 26px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--faint)}
.foot img{height:20px;width:auto;display:block}
.classif{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);background:var(--mint-2);border:1px solid var(--border);border-radius:4px;padding:2px 8px}
@media (max-width:760px){.foot .in{padding:16px}}

html,body{background:var(--bg)}
</style>
<div class="app">

<script>
window.DP_FRAMEWORK={"version":"2.0.0","axioms":[{"id":"A1","name":"Purpose","text":"Data exists to reduce uncertainty in decisions."},{"id":"A2","name":"Realization","text":"Value is created at the point of consumption, not collection."},{"id":"A3","name":"Enforcement","text":"Governance is architecture, not bureaucracy. A policy that is not enforced by a system is a suggestion."},{"id":"A4","name":"Ownership","text":"Domains own data; platforms reduce the cognitive load of ownership."},{"id":"A5","name":"Upper Bound","text":"AI outcomes are bounded by data readiness: no AI system outperforms its weakest data dimension."},{"id":"A6","name":"Funding","text":"Modernization must pay for itself in waves. Every wave ships measurable value."},{"id":"A7","name":"Consumers","text":"AI agents are consumers of data, not exceptions to governance."}],"levels":{"1":{"name":"Ad Hoc","summary":"Depends on individuals; not repeatable; not measured."},"2":{"name":"Standardized","summary":"Documented and repeatable in places; enforced by people, not systems."},"3":{"name":"Platform-Enabled","summary":"Built into the platform for critical scope; owned and measured."},"4":{"name":"AI-Assisted","summary":"Measured end-to-end, enforced as code, and accelerated by AI with human review."},"5":{"name":"Agentic","summary":"Self-maintaining within policy; humans supervise exceptions and set policy."}},"weights":{"Critical":3.0,"High":2.0,"Standard":1.0,"Trajectory":0.5},"tiers":{"T1":{"name":"Data for AI Readiness","question":"Is the data ready to be consumed by people, models and agents?","aggregation":"Readiness ceiling = min(R1..R6). R7 is reported as a trajectory and can never exceed its foundations."},"T2":{"name":"AI for Data Capability","question":"Is AI being used to make the data estate better, faster than people alone could?","aggregation":"Weighted average (D2 25%, D3 20%, D4 20%, D1 15%, D5 10%, D6 10%). Emits flywheel status."},"T3":{"name":"Execution Principles","question":"Is the program run so that gains compound instead of dissipating?","aggregation":"Simple average with a critical flag on any principle below 1.5."}},"dimensions":[{"id":"R1","tier":"T1","name":"Discoverable","north_star":false,"definition":"People and machines can find the data that exists, who owns it and whether it is fit for purpose, without asking someone.","failure_mode":"Teams rebuild datasets that already exist; AI projects stall on 'where is the data?'"},{"id":"R2","tier":"T1","name":"Understood","north_star":false,"definition":"Meaning, lineage and caveats are explicit and machine-readable, so the same number means the same thing everywhere.","failure_mode":"Meetings argue about whose number is right; models learn from fields nobody can explain."},{"id":"R3","tier":"T1","name":"Trusted","north_star":false,"definition":"Quality expectations are published, measured and met; issues are caught before consumers see them.","failure_mode":"Shadow spreadsheets re-check official numbers; AI outputs inherit silent data defects."},{"id":"R4","tier":"T1","name":"Governed","north_star":false,"definition":"Access, classification, retention and audit are enforced by the platform, consistently across every engine and consumer.","failure_mode":"Access takes weeks or is far too broad; nobody can prove who used what, for what purpose."},{"id":"R5","tier":"T1","name":"Integrated","north_star":false,"definition":"New sources are onboarded quickly through standard patterns, and core entities resolve to one trusted view.","failure_mode":"Every project reconciles customers and products again; onboarding a source takes a quarter."},{"id":"R6","tier":"T1","name":"Performant","north_star":false,"definition":"Freshness, latency and cost meet what the decision or model actually needs, predictably and measurably.","failure_mode":"Stale or slow data forces workarounds; costs grow with no unit economics."},{"id":"R7","tier":"T1","name":"Agent-Addressable","north_star":true,"definition":"Agents can discover, understand and act on governed data through programmatic interfaces under the same policies as humans, with full traceability.","failure_mode":"Agents run on shared credentials and copied data, outside governance, with no audit trail."},{"id":"D1","tier":"T2","name":"AI Discovery","weight":0.15,"north_star":false,"definition":"AI generates and maintains metadata and lets people find data in natural language.","failure_mode":"Catalog coverage never catches up with the estate because curation is manual."},{"id":"D2","tier":"T2","name":"AI Quality","weight":0.25,"north_star":false,"definition":"AI infers quality rules, detects anomalies and accelerates root cause and remediation.","failure_mode":"Hand-written rules cover a fraction of data; issues are found by consumers."},{"id":"D3","tier":"T2","name":"AI Governance","weight":0.2,"north_star":false,"definition":"AI systems are inventoried, risk-tiered and gated; AI is also used to enforce governance at scale.","failure_mode":"Models and GenAI apps ship without inventory, evaluation or guardrails."},{"id":"D4","tier":"T2","name":"AI DataOps","weight":0.2,"north_star":false,"definition":"Pipelines are code, tested and deployed automatically, with AI accelerating build, test and operations.","failure_mode":"Engineering capacity is consumed keeping fragile pipelines alive."},{"id":"D5","tier":"T2","name":"AI Semantics","weight":0.1,"north_star":false,"definition":"Business meaning is captured in a machine-readable semantic model that AI can reason over accurately.","failure_mode":"AI assistants answer data questions confidently and incorrectly."},{"id":"D6","tier":"T2","name":"AI Stewardship","weight":0.1,"north_star":true,"definition":"Agents perform routine stewardship under human supervision, and readiness compounds measurably.","failure_mode":"Stewardship is an unfunded side job; readiness decays as the estate grows."},{"id":"P1","tier":"T3","name":"Domain Pain Sequencing","north_star":false,"definition":"Work is sequenced by quantified business pain and data readiness, not by technology preference.","failure_mode":"Platform-first programs build capability nobody consumes."},{"id":"P2","tier":"T3","name":"Funded Waves","north_star":false,"definition":"Funding is released in waves gated on measured value from the previous wave.","failure_mode":"Multi-year programs promise value at the end and lose sponsorship in the middle."},{"id":"P3","tier":"T3","name":"Platform Governance","north_star":false,"definition":"Governance is enforced, logged and recoverable in the platform: guardrails, not review boards.","failure_mode":"Policies live in documents; compliance depends on memory and goodwill."},{"id":"P4","tier":"T3","name":"Cognitive Load Reduction","north_star":false,"definition":"Golden paths and self-service let domain teams deliver without becoming platform experts.","failure_mode":"Every delivery queues behind a central team that knows the tools."},{"id":"P5","tier":"T3","name":"AI Accelerant","north_star":false,"definition":"AI is applied, safely and measurably, to accelerate the data program itself.","failure_mode":"AI is either banned and used anyway, or used without any measurement of benefit."},{"id":"P6","tier":"T3","name":"Consumer-First Design","north_star":false,"definition":"Data products are specified by their consumers, including agents, and retired when unused.","failure_mode":"Producers publish what they have; most published data is never used."},{"id":"P7","tier":"T3","name":"Velocity Measurement","north_star":false,"definition":"Time from signal to decision to action is baselined and drives investment decisions.","failure_mode":"Programs report activity (tables migrated) instead of outcomes (decisions accelerated)."}],"velocity":[{"id":"Discovery","span":"'I have a question' to 'I found the right data'"},{"id":"Integration","span":"'The data exists' to 'it is usable in my context'"},{"id":"Quality","span":"'An issue exists' to 'the issue is resolved'"},{"id":"Insight","span":"'Trusted data' to 'decision-ready insight or model'"},{"id":"Action","span":"'Insight delivered' to 'action taken, with trust intact'"}],"dependencies":[{"dim":"R2","upon":["R1"],"slack":1.0,"why":"You cannot consistently define what you cannot find."},{"dim":"R3","upon":["R2"],"slack":1.0,"why":"You cannot measure the quality of data whose meaning is not agreed."},{"dim":"R7","upon":["R1","R2","R3","R4"],"slack":0.0,"why":"Agent-addressability cannot exceed the foundations agents consume (A5, A7)."},{"dim":"D1","upon":["R1"],"slack":1.0,"why":"AI cataloging amplifies an existing inventory; it cannot replace one."},{"dim":"D2","upon":["R3"],"slack":1.0,"why":"AI quality needs defined expectations to learn from and enforce."},{"dim":"D3","upon":["R4"],"slack":1.0,"why":"AI governance is built on data governance; models inherit data policies."},{"dim":"D4","upon":["P3"],"slack":1.0,"why":"AI-accelerated delivery without platform guardrails accelerates risk."},{"dim":"D5","upon":["R2"],"slack":1.0,"why":"A semantic model for AI needs governed definitions to encode."},{"dim":"D6","upon":["D1","D2","D3"],"slack":0.0,"why":"Agentic stewardship is bounded by the AI capabilities it orchestrates."},{"dim":"P5","upon":["P3"],"slack":1.0,"why":"AI acceleration of delivery requires enforced platform policy for AI usage."}],"jobs":{"Inference":{"path":["R1","R2","R3","R4"],"desc":"Answers questions (BI copilots, RAG, text-to-SQL)."},"Training":{"path":["R3","R5","R4","R6"],"desc":"Learns patterns (predictive models, fine-tuning)."},"Agent":{"path":["R7","R4","R1","R2"],"desc":"Acts autonomously (tool-using agents, automated decisions, write-back)."}},"job_lever_gates":{"Agent":["L-20","L-21","L-22"],"Training":["L-11"],"Inference":[]},"flywheel":[{"status":"Not Engaged","rule":"Tier 2 below 2.0"},{"status":"Emerging","rule":"Tier 2 from 2.0 to below 3.0"},{"status":"Active","rule":"Tier 2 at 3.0 or above"},{"status":"Compounding","rule":"Tier 2 at 4.0 or above and readiness ceiling at 4.0 or above"}],"evidence_types":[{"id":"attestation","name":"Verbal attestation","strength":0,"desc":"Stated in interview. Useful for discovery; never sufficient on its own above level 2."},{"id":"document","name":"Document / policy","strength":1,"desc":"Written standard, policy, runbook or design. Proves intent, not operation."},{"id":"artifact","name":"Artifact / screenshot","strength":1,"desc":"An example output: a catalog page, a contract file, a dashboard. Proves existence."},{"id":"metric","name":"System metric / log","strength":2,"desc":"Telemetry exported from a system: coverage %, MTTR, audit log query. Proves operation at scale."},{"id":"inspection","name":"Platform inspection","strength":2,"desc":"Assessor observed it live in the platform, or ran the check themselves."}],"lever_statuses":["Proposed","Committed","Enforced","Verified","Retired"],"lever_transitions":{"Proposed":["Committed","Retired"],"Committed":["Enforced","Proposed","Retired"],"Enforced":["Verified","Committed","Retired"],"Verified":["Enforced","Retired"],"Retired":["Proposed"]},"enforcement_modes":{"preventive":"Blocks the non-compliant action before it happens (gate, policy, failing check).","detective":"Detects non-compliance quickly and routes it to an owner with an SLA.","corrective":"Automatically remediates or rolls back non-compliance.","directive":"Defines the standard and accountability; must be paired with a detective or preventive lever to count as enforced."},"rules":[{"id":"ENF-01","name":"Evidence gate: level 3","applies":"question","text":"A level of 3 or above needs at least one piece of evidence stronger than verbal attestation (document, artifact, metric or inspection).","effect":"Validated mode: the question is capped at 2. Attested mode: a warning, and the evidence-backed score shows the cap."},{"id":"ENF-02","name":"Evidence gate: level 4+","applies":"question","text":"A level of 4 or 5 needs operating evidence: a system metric/log or a platform inspection. Level 5 needs two independent pieces of evidence.","effect":"Validated mode: capped at 3 (or 4 for level 5 with only one item). Attested mode: a warning."},{"id":"ENF-03","name":"Metric triangulation","applies":"dimension","text":"Where a measured metric maps to a dimension, the dimension cannot exceed the metric-implied level by more than one.","effect":"Dimension is capped at metric level + 1 and an inflation finding is raised."},{"id":"ENF-04","name":"Weakest critical control","applies":"dimension","text":"If any Critical question in a dimension is at level 1, the dimension cannot score above 2.","effect":"Dimension capped at 2.0; a blocker finding is raised."},{"id":"ENF-05","name":"Dimension precedence","applies":"dimension","text":"A dimension cannot run more than its allowed slack ahead of the dimensions it depends on (see dependency table).","effect":"Dimension capped at min(upstream) + slack."},{"id":"ENF-06","name":"Readiness ceiling (A5)","applies":"tier","text":"Tier 1 readiness is the minimum of R1-R6, not the average. The binding constraint is named.","effect":"Ceiling reported with its binding dimension(s); levers on the binding dimension are prioritised."},{"id":"ENF-07","name":"Execution critical flag","applies":"tier","text":"Any execution principle below 1.5 is a critical flag regardless of the Tier 3 average.","effect":"Critical finding; the roadmap must include a lever on that principle in Wave 0."},{"id":"ENF-08","name":"Use-case gate","applies":"use_case","text":"A use case is Go only if every dimension on its job's critical path is at least 3, Conditional from 2, otherwise Blocked. Agent use cases are also Blocked until levers L-20, L-21 and L-22 are Enforced; Training use cases need L-11 Enforced.","effect":"Use case status and the exact levers that unblock it."},{"id":"ENF-09","name":"Lever lifecycle","applies":"lever","text":"Committed needs an owner, a wave and a KPI target. Enforced needs enforcement evidence, a KPI baseline, its prerequisite levers Enforced and its precondition levels met. Verified needs the KPI current value to meet its target. Directive-only levers must be paired with an enforced detective or preventive lever.","effect":"The transition is rejected with the unmet conditions listed. An exception (with an approver, a justification and an expiry of 180 days or less) can override precondition levels only."},{"id":"ENF-10","name":"Wave pays for itself (A6)","applies":"roadmap","text":"Every wave must contain at least one lever with time-to-value of 90 days or less, and must respect wave capacity.","effect":"The roadmap generator enforces it; manual plans that violate it raise findings."},{"id":"ENF-11","name":"Coverage","applies":"dimension","text":"A dimension with less than half its questions answered is provisional and is excluded from tier aggregation.","effect":"Marked provisional; tier scores note the gap."},{"id":"ENF-12","name":"Confidence","applies":"question","text":"A level of 4 or 5 recorded with low confidence is flagged for validation.","effect":"Warning finding."},{"id":"ENF-13","name":"Verification decay","applies":"lever","text":"A Verified lever must be re-verified every 90 days; an exception expires on its expiry date.","effect":"Stale verifications and expired exceptions are reported; expired exceptions no longer override."}],"modes":{"attested":"Phase 0 discovery. Evidence gates warn rather than cap; every other rule is enforced.","validated":"Evidence-backed assessment. All rules, including evidence gates, cap scores."},"waves":[{"id":0,"name":"Wave 0","window":"0-90 days","purpose":"Unblock the binding constraint and prove value fast."},{"id":1,"name":"Wave 1","window":"3-9 months","purpose":"Industrialise the foundations the first use cases depend on."},{"id":2,"name":"Wave 2","window":"9-18 months","purpose":"Turn on the flywheel: AI for data, agent readiness."}],"roles":["Executive sponsor","Data leader","Domain owner","Data engineer","Data steward","Analyst / data consumer","ML / AI engineer","Security & risk","Finance"],"questions":[{"id":"R1.1","kind":"attested","dim":"R1","weight":"Critical","velocity":"Discovery","roles":["Analyst / data consumer","Data engineer","ML / AI engineer"],"jobs":["Inference","Agent"],"prompt":"Walk me through the last time a team needed a dataset they had never used before. How did they find it, and how did they know it was the right one?","intent":"Tests whether discovery is a system capability or depends on tribal knowledge. A real, recent episode is far more reliable than a description of the catalog tool.","probes":["Who did they have to ask, and how many people?","Did they find an owner and a definition, or just a table name?","Could a new hire do the same in their first week?","What did they do when two candidate datasets looked similar?"],"levels":["They asked colleagues or rebuilt the data; there is no searchable inventory anyone relies on.","They searched a catalog or wiki, but results were incomplete or stale and they still had to confirm with a person.","They found it through self-service search, with owner, description and freshness visible, and confirmed fitness without asking anyone.","Search ranked results by usage and certification, flagged a better-certified alternative, and the episode took under a day.","They stated the need in plain language (or an agent did) and were routed to a certified asset, or told none exists, with access provisioning already started."],"evidence":["Catalog search and usage analytics","Screen-share of the search episode","Asset page showing owner, description and freshness"],"red_flags":["Describes the tool purchase rather than an episode","'Everyone knows where it is'","Only the central data team can answer"]},{"id":"R1.2","kind":"attested","dim":"R1","weight":"High","velocity":"Discovery","roles":["Data leader","Data steward"],"jobs":["Inference","Agent"],"prompt":"Of the data assets behind your priority decisions and AI use cases, what share have a named accountable owner, a business description and a freshness indicator?","intent":"Coverage is measured against the scoped critical data elements (CDEs), not the whole estate. A high percentage of an unscoped estate is meaningless.","probes":["How is the denominator defined?","When did someone last check that the listed owners still hold the role?"],"levels":["Under 10%, or nobody knows.","10-40%; owners are often people who have moved on.","40-70%; reviewed at least annually; owners are real and reachable.","70-90%; ownership changes flow automatically from the HR or org directory.","Above 90%; registration is a precondition of publishing, so unregistered assets cannot be consumed."],"evidence":["Coverage report against the CDE inventory","Orphaned-asset report"],"red_flags":["Denominator is 'tables in the catalog' rather than in-scope CDEs","Owner field contains team mailboxes only"]},{"id":"R1.3","kind":"attested","dim":"R1","weight":"Standard","velocity":"Discovery","roles":["Data engineer","Data steward"],"jobs":[],"prompt":"When a new dataset is created in production, how does it become discoverable, and what happens if nobody registers it?","intent":"Discoverability decays unless registration is automatic or enforced. This tests the inflow, not the stock.","probes":[],"levels":["Nothing happens; most new assets stay invisible.","Policy asks producers to register manually; compliance is not measured.","Technical metadata is harvested automatically from the main platforms; business metadata is added by hand.","Harvesting covers all major platforms including BI and ML assets; unregistered or orphaned assets are reported to owners weekly.","The publishing pipeline blocks promotion of any asset that lacks required metadata (registration as code)."],"evidence":["Harvester configuration and run logs","A rejected promotion caused by missing metadata"],"red_flags":["Harvesting exists but only for one platform out of several"]},{"id":"R2.1","kind":"attested","dim":"R2","weight":"Critical","velocity":"Insight","roles":["Executive sponsor","Domain owner","Analyst / data consumer"],"jobs":["Inference","Agent"],"prompt":"Pick a metric your executives review every week, such as 'active customer' or 'net revenue'. How many definitions of it exist across reports, and who arbitrates?","intent":"Definitional conflict is the most common root cause of distrust and of wrong AI answers. Count the definitions; do not accept 'we have a glossary'.","probes":["Show me two reports that use the metric. Do they match?","What happened the last time the definition changed?"],"levels":["Several conflicting definitions; disputes are settled in meetings, case by case.","A glossary exists, but reports do not reference it and definitions drift.","One governed definition for the top metrics, with a named business owner; certified reports use it.","Metrics are defined once in a shared semantic or metrics layer and consumed by BI, notebooks and applications from that single definition.","The semantic layer is machine-readable and used by AI and agents; definition changes are versioned, impact-analysed and communicated automatically."],"evidence":["Metric definition with owner and version history","Two reports reconciling to the same governed definition"],"red_flags":["The answer is the glossary tool's name","Arbitration is 'the CFO decides' with no recorded outcome"]},{"id":"R2.2","kind":"attested","dim":"R2","weight":"High","velocity":null,"roles":["Analyst / data consumer","Data steward","ML / AI engineer"],"jobs":["Inference","Training"],"prompt":"If I pick a column in a critical dataset at random, can a new analyst learn what it means, its valid values and its known caveats without asking anyone?","intent":"Tests documentation depth on critical data elements. Caveats ('this field was repurposed in 2022') are what models and new people trip over.","probes":[],"levels":["No; the column name is the documentation.","Some descriptions exist, mostly technical; caveats live in people's heads.","Critical data elements have business descriptions, valid values and units documented.","Descriptions are generated or suggested automatically and reviewed by stewards; known issues and caveats are attached to the asset.","Documentation stays current automatically as schemas change, and AI assistants answer questions about meaning with citations."],"evidence":["Live random-column test during the session","Asset documentation completeness report"],"red_flags":["Assessor is steered to a showcase table instead of a random one"]},{"id":"R2.3","kind":"attested","dim":"R2","weight":"High","velocity":null,"roles":["Data engineer","Data steward","Security & risk"],"jobs":["Inference","Training"],"prompt":"Take a number on an executive dashboard. Can you trace it back to its source systems, and how long would that take?","intent":"Lineage is what makes meaning auditable and change safe. Ask for column level, not just table level.","probes":[],"levels":["Not without days of reverse-engineering code.","Possible for some pipelines from documentation that is often out of date.","Automated table-level lineage exists for the core platforms.","Column-level lineage end to end, including BI and ML features, and it is used for impact analysis before changes.","Lineage is operational: a change that would break a downstream critical asset is flagged or blocked automatically."],"evidence":["Live lineage trace","A change request that cites lineage impact analysis"],"red_flags":["Lineage stops at the warehouse and excludes BI or ML"]},{"id":"R3.1","kind":"attested","dim":"R3","weight":"Critical","velocity":"Quality","roles":["Data engineer","Analyst / data consumer","Domain owner"],"jobs":["Inference","Training"],"prompt":"Tell me about the last data quality issue that reached a business decision or a customer. Who detected it, how, and how long until it was fixed?","intent":"Who detects issues is the single best indicator of quality maturity. If consumers detect them, monitoring is not working, whatever tools exist.","probes":["How many incidents last quarter, and what share did monitoring detect first?","Has the same root cause happened twice?"],"levels":["End users or customers found it; the fix took weeks; the root cause was not recorded.","Users or ad hoc checks found it; it was ticketed and took days to weeks; similar issues recur.","Rule-based checks on critical datasets catch most issues before consumption; there is a named owner and a resolution SLA.","Automated monitoring of freshness, volume, schema and distribution found it; incidents are tracked with detection and resolution times, and root causes are fed back.","Anomalies are quarantined before publication; known issue classes are remediated automatically; affected consumers are notified automatically."],"evidence":["Incident log with detection source and timestamps","Post-incident review"],"red_flags":["No incident log exists, yet the claim is level 3 or higher","'We rarely have issues'"]},{"id":"R3.2","kind":"attested","dim":"R3","weight":"High","velocity":"Quality","roles":["Data engineer","Domain owner"],"jobs":["Inference","Training"],"prompt":"Do your most important datasets have published quality expectations for freshness, completeness and accuracy, and are they measured?","intent":"Without published expectations, 'quality' cannot be enforced or even disputed. Look for consumer-visible SLOs.","probes":[],"levels":["No defined expectations.","Informal expectations that are not measured.","SLOs are defined for critical datasets, measured and shared with owners.","SLOs are visible to consumers on the asset; breaches trigger alerts and appear in a scorecard.","SLOs are contractual (data contracts) and enforced in pipelines; a breach blocks promotion or triggers a fallback."],"evidence":["SLO definitions","SLO attainment scorecard"],"red_flags":["SLOs exist only for pipeline job success, not for the data itself"]},{"id":"R3.3","kind":"attested","dim":"R3","weight":"High","velocity":"Insight","roles":["Executive sponsor","Analyst / data consumer","Finance"],"jobs":[],"prompt":"Do consumers act on official numbers without re-checking the source? How common are 'shadow' spreadsheets that validate official data?","intent":"Trust is a behaviour. Shadow reconciliation is an expensive, invisible tax and a strong signal of a low real score.","probes":[],"levels":["Shadow reconciliations are common; official numbers are routinely challenged.","Trust varies by team; key reports are re-checked before executive use.","Certified datasets are trusted for most decisions; shadow copies are the exception.","Trust signals (certification, quality score, freshness) are shown where data is consumed, and consumers choose certified assets.","Trust is measured: certified assets carry most consumption, and decisions are logged against the data version used."],"evidence":["Share of queries or reads on certified assets","Consumer trust survey"],"red_flags":["Finance keeps its own copy 'just in case'"]},{"id":"R4.1","kind":"attested","dim":"R4","weight":"Critical","velocity":"Discovery","roles":["Security & risk","Data engineer","Analyst / data consumer"],"jobs":["Inference","Training","Agent"],"prompt":"How does someone get access to sensitive data today, and how long does it take? How is access removed when they change role or leave?","intent":"Governance that is slow drives workarounds; governance that is broad creates exposure. Both show up here. Removal is the half most organisations skip.","probes":["What was the elapsed time for the last three sensitive-data requests?","Pick someone who changed teams recently: what access do they still have?"],"levels":["Ad hoc requests to administrators; shared credentials or broad grants; removal rarely happens.","Ticket-based approvals taking days to weeks; manual periodic recertification.","Role- or attribute-based policies defined centrally; requests routed to data owners; access reviewed at least annually.","Policies are defined once and enforced across every engine (SQL, notebooks, BI, ML); classification drives masking and row filtering; joiner, mover and leaver changes are automated.","Policy as code with automated tests; purpose-based access; just-in-time grants that expire automatically; every decision audited and analysed continuously."],"evidence":["Access request log with timestamps","Policy definitions","Recertification records"],"red_flags":["Service accounts with broad read access used by many people","Different policies per engine"]},{"id":"R4.2","kind":"attested","dim":"R4","weight":"Critical","velocity":null,"roles":["Security & risk","Data steward"],"jobs":["Training","Agent"],"prompt":"How is sensitive data (personal, health, payment, confidential IP) identified, and what share of in-scope data is classified?","intent":"Every downstream control (masking, retention, AI training eligibility) depends on classification. Unclassified data is ungoverned data.","probes":[],"levels":["Not systematically identified.","Manually classified for some known systems.","A classification standard exists; automated scanning runs on core platforms; more than half of in-scope assets are classified.","More than 80% classified, propagated through lineage, and classifications drive policy (such as masking) automatically.","Classification runs continuously at ingestion with a feedback loop for misclassification; unclassified data cannot be published."],"evidence":["Classification coverage report","Scanner configuration and findings"],"red_flags":["Classification only covers structured data while AI use cases consume documents"]},{"id":"R4.3","kind":"attested","dim":"R4","weight":"High","velocity":null,"roles":["Security & risk","Data leader"],"jobs":["Training","Agent"],"prompt":"If an auditor asked tomorrow who accessed a specific customer's data in the last 90 days, for what purpose, and whether it was used to train or prompt any model, how would you answer and how long would it take?","intent":"A concrete audit scenario exposes whether audit logs are unified and whether AI usage of data is traceable.","probes":[],"levels":["We could not answer.","Weeks of manual log gathering across systems, and the answer would be incomplete.","Access logs are centralised; we could answer in days with manual correlation.","Unified audit across data and AI assets answers it in hours, including model training lineage.","Self-service audit queries answer it in minutes, including agent actions and model lineage."],"evidence":["Run the audit query live","Audit log retention configuration"],"red_flags":["Purpose of access is not captured anywhere"]},{"id":"R4.4","kind":"attested","dim":"R4","weight":"High","velocity":null,"roles":["Security & risk","Data engineer"],"jobs":["Training"],"prompt":"How are retention limits and deletion obligations, including individual erasure requests, carried out across copies, derived datasets and trained models?","intent":"Deletion must follow lineage. Copies in sandboxes, feature stores and model training sets are where obligations are silently breached.","probes":[],"levels":["Not systematically; deletion depends on someone remembering.","Manual process for primary systems only; copies and derivatives are not covered.","Retention policies are defined per classification and applied to core platforms; erasure requests are tracked to completion.","Retention and erasure are executed automatically and propagate through lineage to derived datasets; completion is evidenced.","Retention, consent and erasure are enforced as policy across data and AI assets, including retraining or exclusion obligations for models."],"evidence":["Erasure request log with completion evidence","Retention policy configuration"],"red_flags":["Backups and sandboxes explicitly excluded"]},{"id":"R5.1","kind":"attested","dim":"R5","weight":"Critical","velocity":"Integration","roles":["Data engineer","Domain owner"],"jobs":["Training"],"prompt":"Walk me through the most recent new source system you onboarded. How long from request to the first trusted consumption, and what was hand-built?","intent":"Integration velocity is the clearest signal of platform leverage. Ask for the latest real example and count the bespoke work.","probes":[],"levels":["Months; bespoke code per source; a long central backlog.","Weeks; scheduled pipelines with some reusable patterns.","Days to weeks; standard ingestion templates; an agreement or contract with the source owner.","Days; metadata-driven ingestion with automated tests; incremental change capture is the default.","Hours; domains self-serve onboarding within guardrails; schema evolution is handled automatically."],"evidence":["Onboarding ticket timeline","Ingestion framework configuration for the source"],"red_flags":["Example offered is a source onboarded by a vendor-led project, not the normal path"]},{"id":"R5.2","kind":"attested","dim":"R5","weight":"High","velocity":"Integration","roles":["Domain owner","Data steward","Data engineer"],"jobs":["Training","Agent"],"prompt":"Are core entities such as customer, product, supplier and account resolved to one trusted view, or reconciled again in each project?","intent":"Unresolved entities multiply integration cost and corrupt training data. Ask how match quality is measured.","probes":[],"levels":["Each project reconciles its own; counts conflict.","Periodic manual de-duplication; no designated system of record.","Each core entity has one designated system of record that others defer to.","Governed match and merge with survivorship rules and a stewardship workflow; match accuracy is measured on production data.","Continuous mastering with feedback-tuned matching; golden records available in near real time to applications and agents."],"evidence":["Match precision and recall on production data","Stewardship queue metrics"],"red_flags":["Golden record exists but most consumers still join on source keys"]},{"id":"R5.3","kind":"attested","dim":"R5","weight":"Standard","velocity":"Integration","roles":["Data engineer"],"jobs":[],"prompt":"When an upstream system changes its schema or the meaning of a field, how do downstream consumers find out?","intent":"Tests whether integration is a governed interface (contract) or a fragile coupling.","probes":[],"levels":["When something breaks.","Informal notices; breakages are frequent.","Data contracts exist for critical feeds, and changes are negotiated.","Contract checks in CI/CD block breaking changes, and affected consumers are notified automatically via lineage.","Versioned contracts with automated compatibility handling and deprecation windows."],"evidence":["Contract definitions in version control","A blocked breaking change"],"red_flags":["Contracts are documents, not executable checks"]},{"id":"R6.1","kind":"attested","dim":"R6","weight":"High","velocity":"Insight","roles":["Analyst / data consumer","Data engineer"],"jobs":["Training","Inference"],"prompt":"For your critical analytical and AI workloads, what freshness and response time do consumers actually need, and what do they get?","intent":"Performance is relative to the decision. Daily batch is fine for strategy and fatal for fraud. Ask for the requirement first.","probes":[],"levels":["Unknown; users complain about slowness and stale data.","Mostly daily batch or slower; known gaps against needs; not measured.","Freshness and latency requirements are documented per critical use case and met for most.","Workloads meet SLOs measured continuously; streaming or incremental processing is used where the decision needs it.","Performance tunes itself (scaling, optimisation); SLOs are met at predictable cost."],"evidence":["Freshness and latency SLO attainment","Requirement register per use case"],"red_flags":["'Real time' requested everywhere with no decision rationale"]},{"id":"R6.2","kind":"attested","dim":"R6","weight":"High","velocity":null,"roles":["Finance","Data leader"],"jobs":[],"prompt":"Can you state the unit cost of your key data products, such as cost per refreshed dataset, per query or per model inference? Who sees it?","intent":"Without unit economics, performance and value trade-offs are guesses and AI workloads become a cost surprise.","probes":[],"levels":["Only the total platform bill.","Cost by account or project; not attributed to products.","Costs are tagged and attributed to domains and products, and reviewed monthly.","Unit economics per data product are visible to owners; budgets and alerts are enforced.","Automated optimisation and chargeback; cost and performance trade-offs are decided by policy."],"evidence":["Cost attribution report","Budget policy configuration"],"red_flags":["More than a quarter of spend is untagged"]},{"id":"R6.3","kind":"attested","dim":"R6","weight":"Standard","velocity":null,"roles":["Data engineer"],"jobs":[],"prompt":"What happened during your last demand spike, such as quarter close, a campaign or a new AI feature launch?","intent":"Elasticity and workload isolation matter most at the moments the business needs data most.","probes":[],"levels":["Outages or long queues; manual firefighting.","Capacity planned manually ahead of known peaks.","Critical consumers are isolated from other workloads; elastic compute for the main workloads.","Autoscaling with guardrails; peak performance is load-tested.","Predictive scaling; no consumer-visible degradation."],"evidence":["Monitoring from the last peak","Workload isolation configuration"],"red_flags":[]},{"id":"R7.1","kind":"attested","dim":"R7","weight":"Trajectory","velocity":"Action","roles":["ML / AI engineer","Security & risk"],"jobs":["Agent"],"prompt":"Could an AI agent today find, understand and safely query your governed data through an API, under the same policies a human would be subject to?","intent":"Agent-addressability is the North Star for data readiness. The key test is identity: does the agent act as itself, under policy, or through a shared credential?","probes":[],"levels":["No; data is only reachable through human-oriented tools.","APIs exist for some data, but they bypass governance or use shared service credentials.","Governed programmatic access (SQL or API) with per-identity policies; metadata is available through APIs.","Agents use distinct identities with least-privilege, scoped permissions; tool interfaces sit over certified data; every action is audited.","Agents discover, request and use data through standard tool and context protocols, with purpose-based policies, rate limits and human approval for write actions."],"evidence":["Agent identity and permission configuration","Audit trail of an agent session"],"red_flags":["Agent uses a developer's personal token","Data copied into a vector store outside governance"]},{"id":"R7.2","kind":"attested","dim":"R7","weight":"Trajectory","velocity":"Action","roles":["ML / AI engineer","Security & risk"],"jobs":["Agent"],"prompt":"If an agent took an action based on your data, such as sending an offer or updating a record, could you reconstruct what data, version, policy and instructions it used?","intent":"Traceability is what makes agentic action defensible to customers, auditors and regulators.","probes":[],"levels":["No.","Partial logs, per application.","Agent requests and responses are logged centrally.","Full trace: data versions, tools called, policy decisions and human approvals.","Traces are evaluated continuously for quality and safety; anomalous behaviour suspends the agent automatically."],"evidence":["A reconstructed trace of a real agent action"],"red_flags":[]},{"id":"R7.3","kind":"attested","dim":"R7","weight":"Trajectory","velocity":"Action","roles":["Security & risk","ML / AI engineer","Executive sponsor"],"jobs":["Agent"],"prompt":"What rules define what agents may write back or act on, and how are those rules enforced technically?","intent":"Autonomy must be graduated by risk and enforced by the platform, not by prompt instructions.","probes":[],"levels":["None.","A policy statement only.","Write actions are limited to sandboxes or approved targets, and need human approval.","Graduated autonomy tiers per action risk, enforced by the platform.","Autonomy adjusts dynamically with measured agent reliability; the kill switch has been tested."],"evidence":["Autonomy tier policy","Kill-switch test record"],"red_flags":["Guardrails exist only in the system prompt"]},{"id":"D1.1","kind":"attested","dim":"D1","weight":"High","velocity":"Discovery","roles":["Data steward"],"jobs":[],"prompt":"How much of your metadata (descriptions, tags, classifications) is created or suggested by AI rather than typed by people, and how often do stewards accept it?","intent":"AI cataloging is the only way coverage keeps pace with the estate. The acceptance rate shows whether it is trusted.","probes":[],"levels":["None; all manual.","Piloted on a few sources (under 20%).","AI-generated descriptions and tags for more than half of sources, with steward review.","More than 70% of sources; acceptance rate is tracked; new assets get recommendations; duplicates are detected.","More than 90% maintained automatically; humans review exceptions only."],"evidence":["AI suggestion acceptance metrics","Coverage by source"],"red_flags":[]},{"id":"D1.2","kind":"attested","dim":"D1","weight":"Standard","velocity":"Discovery","roles":["Analyst / data consumer"],"jobs":[],"prompt":"Can people ask questions about the data estate in plain language, such as 'where is churn data for EMEA?', and get a trustworthy answer?","intent":"Natural-language discovery must be grounded in governed metadata and respect permissions, or it creates confident misdirection.","probes":[],"levels":["No.","A generic chatbot that is not grounded in metadata.","Natural-language search grounded in catalog metadata for some domains.","Grounded in certified metadata, permission-aware, with citations.","Agentic discovery that also starts access requests and explains fitness for purpose."],"evidence":["Live demonstration with an unscripted question"],"red_flags":[]},{"id":"D2.1","kind":"attested","dim":"D2","weight":"Critical","velocity":"Quality","roles":["Data engineer"],"jobs":[],"prompt":"How are data quality checks created: hand-written by engineers, or inferred from the data?","intent":"Hand-written rules do not scale beyond a few critical tables. AI-inferred monitoring is how coverage becomes estate-wide.","probes":[],"levels":["There are none, or they are ad hoc.","Hand-written for some critical tables.","Profiling suggests rules and engineers approve them; covers critical datasets.","ML anomaly detection on freshness, volume and distribution for most production datasets; alert precision is tracked.","Self-learning monitors with automated root-cause hints and remediation for known issue classes."],"evidence":["Monitor coverage report","Alert precision metrics"],"red_flags":[]},{"id":"D2.2","kind":"attested","dim":"D2","weight":"High","velocity":"Quality","roles":["Data engineer"],"jobs":[],"prompt":"When a quality issue is detected, how is the root cause found, and how long does that take?","intent":"Detection without fast diagnosis just moves the queue. This is where lineage plus AI pays off.","probes":[],"levels":["Manual investigation from scratch.","Runbooks plus manual lineage tracing.","Lineage-assisted impact and root-cause analysis.","AI-assisted triage suggests the probable cause and owner; resolution time is tracked and falling.","Agents diagnose and propose or execute fixes within guardrails; humans approve high-impact ones."],"evidence":["Incident timeline showing triage steps","Resolution time trend"],"red_flags":[]},{"id":"D2.3","kind":"attested","dim":"D2","weight":"Standard","velocity":"Quality","roles":["Data engineer"],"jobs":[],"prompt":"What share of data quality alerts lead to action? What happens to the rest?","intent":"Alert fatigue silently disables monitoring. Precision matters as much as coverage.","probes":[],"levels":["There are no alerts.","Alerts are noisy and often ignored.","Alerts are tuned for critical assets and routed to owners.","Precision is measured, over 70% of alerts are actionable, and fatigue is managed.","Alerts adapt to seasonality, and over 90% are actionable."],"evidence":["Alert disposition statistics"],"red_flags":[]},{"id":"D3.1","kind":"attested","dim":"D3","weight":"Critical","velocity":null,"roles":["Security & risk","ML / AI engineer","Data leader"],"jobs":["Training","Agent","Inference"],"prompt":"Do you have an inventory of the AI models, AI features and agents in use, including third-party and embedded AI, with owners and risk classification?","intent":"You cannot govern what you have not inventoried. Vendor and embedded AI are the usual blind spots.","probes":[],"levels":["No inventory.","A partial spreadsheet; vendor AI is not included.","Inventory of in-house models with owners and risk tiers.","Inventory includes third-party, generative AI and agents, linked to training-data lineage and approvals; risk tier drives controls.","Populated automatically from platforms, with continuous compliance status per system against applicable regulations and frameworks."],"evidence":["The inventory itself","Risk-tiering criteria"],"red_flags":["Inventory excludes AI features inside SaaS tools"]},{"id":"D3.2","kind":"attested","dim":"D3","weight":"High","velocity":null,"roles":["ML / AI engineer","Security & risk"],"jobs":["Training","Agent","Inference"],"prompt":"Before a model or generative AI application goes live, what must be true, and who can stop it?","intent":"Release gates must be risk-tiered and enforced in the deployment path, with someone independent empowered to say no.","probes":[],"levels":["Nothing formal.","Informal review by a team lead.","A documented release checklist (evaluation, bias, privacy) for higher-risk use cases.","Risk-tiered gates enforced in the deployment pipeline; evaluations recorded; independent review for high risk.","Continuous evaluation in production (drift, hallucination, bias, safety) with automated rollback."],"evidence":["Gate configuration in the deployment pipeline","Evaluation records for the last release"],"red_flags":[]},{"id":"D3.3","kind":"attested","dim":"D3","weight":"High","velocity":null,"roles":["Security & risk","ML / AI engineer"],"jobs":["Agent","Inference"],"prompt":"How is AI used to enforce governance, for example detecting policy violations, personal data in prompts, or sensitive content in documents?","intent":"Governance at AI scale needs AI-assisted enforcement; humans cannot review every prompt or document.","probes":[],"levels":["Not used.","Experiments only.","Automated detection of personal data in structured and some unstructured data.","Guardrails on prompts and outputs (personal data, toxicity, prompt injection) for production generative AI, with violations logged.","AI continuously monitors policy compliance across the data and AI estate and remediates automatically."],"evidence":["Guardrail configuration","Violation log"],"red_flags":[]},{"id":"D4.1","kind":"attested","dim":"D4","weight":"High","velocity":"Integration","roles":["Data engineer"],"jobs":[],"prompt":"How are data pipelines built, tested and deployed? Show me the last production change.","intent":"Engineering discipline is the precondition for safe AI acceleration. Look at a real change, not the standard.","probes":[],"levels":["Manually, directly in production.","Version control for some; manual deployments.","CI/CD with automated tests for critical pipelines; separate environments.","Infrastructure and pipelines as code; AI assistance in authoring and testing; deployment frequency and change failure rate tracked.","Agents generate, test and optimise pipelines under review; delivery metrics at elite levels."],"evidence":["Pull request and pipeline run for the last change","Delivery metrics"],"red_flags":[]},{"id":"D4.2","kind":"attested","dim":"D4","weight":"Standard","velocity":null,"roles":["Data engineer"],"jobs":[],"prompt":"How are pipeline failures handled overnight and at weekends?","intent":"Operational toil is where AI DataOps pays off first: classification, retry, self-healing.","probes":[],"levels":["Someone notices the next day.","On-call engineer is paged for every failure.","Failures are classified, with runbooks for common causes.","Known failure modes retry or self-heal automatically; only novel failures page a person.","Agents diagnose and remediate most failures; humans review a daily digest."],"evidence":["On-call and incident statistics"],"red_flags":[]},{"id":"D5.1","kind":"attested","dim":"D5","weight":"High","velocity":"Insight","roles":["Data leader","Data steward","ML / AI engineer"],"jobs":["Inference","Agent"],"prompt":"Is business meaning (metrics, entities, relationships) captured in a machine-readable form that an AI system can use, such as a semantic layer, ontology or knowledge graph?","intent":"AI answers are only as correct as the semantics they are grounded in.","probes":[],"levels":["No; meaning lives in reports and people.","Glossary documents that are not machine-readable.","A semantic or metrics layer for core metrics, consumed by BI.","The semantic model is consumed by both BI and AI (text-to-SQL, assistants), with measured answer accuracy.","A knowledge graph or ontology links entities, metrics and policies; AI keeps it current and agents reason over it."],"evidence":["Semantic model definition","Consumers of the semantic model"],"red_flags":[]},{"id":"D5.2","kind":"attested","dim":"D5","weight":"High","velocity":"Insight","roles":["ML / AI engineer","Analyst / data consumer"],"jobs":["Inference"],"prompt":"When a business user asks an AI assistant a data question, how often is the answer correct, and how do you know?","intent":"Only a benchmark of real questions with known answers turns 'it seems good' into a number.","probes":[],"levels":["No assistant, or accuracy is unknown.","A pilot; evidence is anecdotal.","Evaluated against a benchmark set of questions; accuracy is known.","Benchmark accuracy above 85% in in-scope domains; continuous evaluation; failures feed back into the semantic model.","Above 95%, with abstention when unsure; answers cite certified assets."],"evidence":["Benchmark set and latest results"],"red_flags":["Accuracy measured on the demo questions"]},{"id":"D6.1","kind":"attested","dim":"D6","weight":"Trajectory","velocity":null,"roles":["Data steward","Data leader"],"jobs":[],"prompt":"What do your data stewards actually spend their time on?","intent":"Stewardship either scales through AI or becomes the bottleneck. Time allocation shows which.","probes":[],"levels":["No stewards; stewardship is an unfunded side job.","Manual curation and chasing owners.","Defined steward roles with allocated time, working from prioritised queues.","AI handles routine curation; stewards review suggestions and exceptions; throughput is measured.","Agents maintain metadata, quality and policy; stewards supervise and set policy."],"evidence":["Steward queue throughput","Role descriptions with time allocation"],"red_flags":[]},{"id":"D6.2","kind":"attested","dim":"D6","weight":"Trajectory","velocity":null,"roles":["Data leader"],"jobs":[],"prompt":"Can you show that AI-driven data improvements raised readiness? For example, did AI cataloging measurably improve discoverability?","intent":"This is the flywheel test: AI for data should measurably raise data for AI.","probes":[],"levels":["Not measured.","Anecdotes.","Improvement tracked for selected assets.","Readiness gains attributed to AI capabilities every quarter.","Continuous, compounding improvement visible in scorecards."],"evidence":["Readiness scorecard trend with attribution"],"red_flags":[]},{"id":"P1.1","kind":"attested","dim":"P1","weight":"Critical","velocity":null,"roles":["Executive sponsor","Data leader","Domain owner"],"jobs":[],"prompt":"How was the current sequence of data work decided? Show me the top three priorities and the business pain each one removes.","intent":"Programs sequenced by technology rather than pain build capability nobody consumes.","probes":[],"levels":["Technology-led (platform first, use cases later); no explicit pain.","Driven by the loudest stakeholder; priorities change often.","Prioritised by documented business pain or value per domain, reviewed quarterly.","Value at stake is quantified per domain, and sequencing optimises value against readiness; decisions are transparent.","The portfolio is rebalanced continuously from measured outcomes."],"evidence":["Prioritisation record with value estimates"],"red_flags":["Top priority is 'migrate to the new platform'"]},{"id":"P1.2","kind":"attested","dim":"P1","weight":"High","velocity":null,"roles":["Data leader","ML / AI engineer"],"jobs":["Inference","Training","Agent"],"prompt":"For your top AI use cases, were the data requirements (critical data elements and owning domains) scoped before the work was funded?","intent":"Scoping before funding prevents the most common AI failure: launching, then discovering the data is not ready.","probes":[],"levels":["No; use cases launch and then block on data.","Sometimes, informally.","A scoping protocol maps use cases to domains and critical data elements before funding.","Readiness is assessed for the scoped elements, and gaps are funded alongside the use case.","Scoping is automated from catalog and lineage, and readiness gates are enforced in portfolio governance."],"evidence":["Use-case scoping records"],"red_flags":[]},{"id":"P2.1","kind":"attested","dim":"P2","weight":"Critical","velocity":null,"roles":["Executive sponsor","Finance","Data leader"],"jobs":[],"prompt":"How is data modernisation funded: one large program, an annual budget, or incremental waves tied to value?","intent":"Waves gated on measured value keep sponsorship alive and force prioritisation (A6).","probes":[],"levels":["Unfunded, or one-off project budgets with no line of sight to value.","A large multi-year program funded upfront, with value promised at the end.","Funded in waves with defined scope and expected value.","Each wave must demonstrate measured value to unlock the next; benefits are tracked by finance.","Self-funding: realised value is reinvested through a standing mechanism."],"evidence":["Funding gates and benefit tracking"],"red_flags":[]},{"id":"P2.2","kind":"attested","dim":"P2","weight":"High","velocity":null,"roles":["Executive sponsor","Domain owner","Finance"],"jobs":[],"prompt":"When did the data program last deliver something a business leader would call valuable, and how was that value measured?","intent":"Recency and measurement of value predict whether the next wave gets funded.","probes":[],"levels":["More than 12 months ago, or unknown.","6-12 months ago; the value is anecdotal.","Within the last quarter; outcomes are stated qualitatively.","Every quarter; outcomes are quantified and validated by the business owner.","Continuously; a value dashboard is co-owned with finance."],"evidence":["Benefit realisation record signed off by the business owner"],"red_flags":[]},{"id":"P3.1","kind":"attested","dim":"P3","weight":"Critical","velocity":null,"roles":["Security & risk","Data leader","Data engineer"],"jobs":[],"prompt":"Are your governance policies enforced by the platform, or by people following documents? Name one policy and show where it is enforced.","intent":"A3: governance is architecture. A policy that is not enforced by a system is a suggestion.","probes":[],"levels":["Documents only, or nothing.","Manual checkpoints such as review boards.","Core policies (access, classification) are technically enforced on the main platform.","Policies as code, enforced consistently across platforms; exceptions are time-bound and tracked.","Governance is invisible to compliant users (guardrails, not gates), with continuous control monitoring."],"evidence":["Policy-as-code repository","Enforcement log showing a blocked action","Exception register"],"red_flags":["The review board is the enforcement mechanism"]},{"id":"P3.2","kind":"attested","dim":"P3","weight":"High","velocity":null,"roles":["Data engineer","Security & risk"],"jobs":[],"prompt":"If a critical dataset were corrupted or deleted today, how fast could you recover it and prove its integrity?","intent":"Recoverability is the part of governance people forget until it is needed.","probes":[],"levels":["Unknown, or not possible.","Backups exist; restore is untested; days.","Recovery of critical assets has been tested; recovery point and time objectives are defined.","Point-in-time recovery or versioning, with regular restore drills; recovery in hours.","Automated recovery and integrity verification; recovery in minutes; immutable audit."],"evidence":["Last restore drill record"],"red_flags":[]},{"id":"P4.1","kind":"attested","dim":"P4","weight":"High","velocity":"Insight","roles":["Domain owner","Data engineer"],"jobs":[],"prompt":"How many tools and hand-offs does a domain team need to go from raw data to a published data product?","intent":"A4: platforms exist to reduce the cognitive load of ownership. Count the hand-offs.","probes":[],"levels":["Many tools, and a central team does it all; domains cannot self-serve.","Domains can do parts, with heavy central help.","A documented golden path with templates for common patterns.","A self-service platform with guardrails; a domain team publishes a product in days without raising tickets.","The platform anticipates needs; AI assistants scaffold products end to end."],"evidence":["Golden-path documentation and templates","Timeline of the last domain-built product"],"red_flags":[]},{"id":"P4.2","kind":"attested","dim":"P4","weight":"Standard","velocity":null,"roles":["Data engineer","Analyst / data consumer"],"jobs":[],"prompt":"How long until a new engineer or analyst ships their first change to production, and how do they learn the standards?","intent":"Onboarding time is a direct measure of platform cognitive load.","probes":[],"levels":["Months; knowledge is tribal.","Weeks of shadowing; some documentation.","A defined onboarding path; first production change within 4 weeks.","Templates, documentation and office hours; under 2 weeks; developer satisfaction measured.","Under 1 week, with AI-assisted onboarding."],"evidence":["Onboarding records"],"red_flags":[]},{"id":"P5.1","kind":"attested","dim":"P5","weight":"High","velocity":null,"roles":["Data leader","Data engineer"],"jobs":[],"prompt":"Where is AI used to accelerate the data program itself, rather than business use cases, and what has it measurably saved?","intent":"AI should compress the modernisation timeline. Without measurement, it is anecdote.","probes":[],"levels":["Nowhere.","Individuals use coding assistants informally.","Sanctioned AI assistants for engineering and analysis, with usage policies.","AI embedded in delivery (pipeline, test and documentation generation, migration), with productivity gains measured.","Agentic delivery for routine work; humans focus on design and review; gains are reinvested."],"evidence":["Productivity measurement before and after"],"red_flags":[]},{"id":"P5.2","kind":"attested","dim":"P5","weight":"Standard","velocity":null,"roles":["Security & risk"],"jobs":[],"prompt":"What is the policy on AI tool usage with company data, and how do you know it is followed?","intent":"An unenforced ban drives shadow AI; an unenforced allowance leaks data.","probes":[],"levels":["No policy, or a ban that is ignored.","A written policy that is not monitored.","An approved tools list, data handling rules and training.","Technical controls (approved gateways, data loss prevention) with monitored usage.","Policy adapts per data classification, and usage analytics feed value measurement."],"evidence":["Gateway or DLP configuration","Usage reports"],"red_flags":[]},{"id":"P6.1","kind":"attested","dim":"P6","weight":"High","velocity":"Action","roles":["Domain owner","Analyst / data consumer"],"jobs":[],"prompt":"Who decided what the last data product you published had to look like: the producers or the consumers? Show me its requirements.","intent":"A2: value is created at consumption. Consumer-defined products get used.","probes":[],"levels":["Producers publish what they have.","Consumers are consulted informally.","Products are defined from consumer needs, with documented requirements and SLAs.","Adoption and satisfaction are measured per product, and unused products are retired.","The roadmap is driven by usage analytics and feedback loops; agents are treated as first-class consumers."],"evidence":["Product specification with consumer sign-off","Adoption metrics"],"red_flags":[]},{"id":"P6.2","kind":"attested","dim":"P6","weight":"Standard","velocity":null,"roles":["Data steward","Finance"],"jobs":[],"prompt":"What share of published datasets are actually used, and do you retire the rest?","intent":"Unused data costs money, widens the attack surface and dilutes discovery.","probes":[],"levels":["Unknown.","Known to be low; nothing is retired.","Usage is measured, with a quarterly clean-up.","Products below a usage threshold are reviewed for retirement; the cost of unused data is visible.","Automated lifecycle: unused assets are archived according to policy."],"evidence":["Usage distribution report","Retirement log"],"red_flags":[]},{"id":"P7.1","kind":"attested","dim":"P7","weight":"Critical","velocity":null,"roles":["Executive sponsor","Data leader"],"jobs":[],"prompt":"Which of these do you measure today, with a baseline: time to discover, time to integrate, time to resolve quality issues, time to insight, time to action?","intent":"Velocity is the executive outcome. Unmeasured velocity cannot be improved or funded.","probes":[],"levels":["None.","Anecdotal or one-off measurements.","One or two are measured, with baselines.","All five <script>
/* Browser-only backend for the claude.ai edition: answers the app's /api/* calls in the page.
