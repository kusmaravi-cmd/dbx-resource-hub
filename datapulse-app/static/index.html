<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataPulse · Everforth Apex</title>
<link rel="icon" href="/static/everforth-apex-lockup.svg">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img class="lockup" src="/static/everforth-apex-lockup.svg" alt="Everforth Apex Systems">
      <div class="brand-name">DataPulse</div>
      <div class="brand-sub">Data &amp; AI readiness · enforced</div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="iconbtn menu" onclick="DP.toggleNav()" aria-label="Menu">☰</button>
      <div class="crumb"><span id="crumbA">DataPulse</span> <b id="crumbB"></b></div>
      <span class="spacer"></span>
      <span id="saveState" class="savestate"></span>
      <span class="badge" id="who"></span>
    </header>
    <div id="banner"></div>
    <div class="content-wrap">
      <div class="content" id="content"><div class="loading">Loading framework…</div></div>
      <footer class="foot"><div class="in"><img src="/static/everforth-logo.png" alt="Everforth"><span>DataPulse · Everforth Apex Data &amp; AI Modernization Standard</span><span class="classif">Confidential · client assessment data</span></div></footer>
    </div>
  </main>
</div>
<div id="drawer" class="drawer" aria-hidden="true"><div class="drawer-inner" id="drawerBody"></div></div>
<div id="scrim" class="scrim" onclick="DP.closeDrawer()"></div>
<script src="/static/app.js"></script>
</body>
</html>
